<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0E1830"/>
      <stop offset="1" stop-color="#15102A"/>
    </linearGradient>
    <linearGradient id="brand" x1="152" y1="78" x2="461" y2="193" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="240" cy="60" r="150" fill="#4F46E5" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="1050" cy="360" r="190" fill="#9333EA" fill-opacity="0.14" filter="url(#glow)"/>

  <g transform="translate(72 70)">
    <rect x="0" y="4" width="64" height="64" rx="18" fill="url(#brand)"/>
    <path d="M17 22H47V46H17V22Z" stroke="#08111F" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M17 24L32 36L47 24" stroke="#08111F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="88" y="56" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="800" fill="url(#brand)" letter-spacing="-2">JEVmail</text>
    <text x="0" y="126" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="650" fill="#F8FAFC">Your inbox, organized by what you need to do next.</text>
    <text x="0" y="168" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#AAB8CF">Self-hosted Gmail triage by required handling — not topic.</text>

    <g transform="translate(0 216)">
      <rect width="178" height="42" rx="21" fill="#17233A" stroke="#2A3B58"/>
      <circle cx="23" cy="21" r="6" fill="#38BDF8"/>
      <text x="39" y="27" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#DCE7F7">Exactly once</text>

      <rect x="192" width="176" height="42" rx="21" fill="#17233A" stroke="#2A3B58"/>
      <circle cx="215" cy="21" r="6" fill="#818CF8"/>
      <text x="231" y="27" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#DCE7F7">Privacy first</text>

      <rect x="382" width="174" height="42" rx="21" fill="#17233A" stroke="#2A3B58"/>
      <circle cx="405" cy="21" r="6" fill="#C084FC"/>
      <text x="421" y="27" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#DCE7F7">Labels only</text>
    </g>
  </g>

  <g transform="translate(726 54)" filter="url(#shadow)">
    <rect width="404" height="312" rx="24" fill="#0D1728" stroke="#263755"/>
    <text x="24" y="38" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C8DA8" letter-spacing="1.2">REQUIRED HANDLING</text>

    <g transform="translate(22 60)">
      <rect width="360" height="56" rx="14" fill="#13253A" stroke="#2F5874"/>
      <circle cx="27" cy="28" r="9" fill="#38BDF8"/>
      <text x="50" y="24" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="750" fill="#EAF7FF">Reply Needed</text>
      <text x="50" y="43" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#8FB2C8">“Can you confirm the reservation time?”</text>
      <text x="321" y="34" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#38BDF8">1</text>
    </g>

    <g transform="translate(22 126)">
      <rect width="360" height="56" rx="14" fill="#171F3A" stroke="#3B4678"/>
      <circle cx="27" cy="28" r="9" fill="#818CF8"/>
      <text x="50" y="24" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="750" fill="#F0F2FF">Action Needed</text>
      <text x="50" y="43" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#9FAAE0">“Your invoice is due Friday.”</text>
      <text x="321" y="34" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#818CF8">2</text>
    </g>

    <path d="M50 204H354" stroke="#25344E" stroke-width="1.5" stroke-dasharray="5 6"/>
    <text x="24" y="228" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#66758F" letter-spacing="0.7">THEN CLASSIFY BY BEST-FIT HANDLING</text>

    <g transform="translate(22 246)">
      <rect width="108" height="34" rx="17" fill="#241934" stroke="#523867"/>
      <text x="18" y="22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#D8B4FE">Receipt</text>

      <rect x="116" width="108" height="34" rx="17" fill="#1A2532" stroke="#37475A"/>
      <text x="133" y="22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#C7D2E0">Shipping</text>

      <rect x="232" width="128" height="34" rx="17" fill="#211D32" stroke="#463D62"/>
      <text x="247" y="22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650" fill="#D6CCEF">Newsletter</text>
    </g>
  </g>
